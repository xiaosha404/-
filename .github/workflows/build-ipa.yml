name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download YOLO Core ML model
        run: |
          mkdir -p Models
          curl -L --fail \
            https://github.com/ultralytics/yolo-ios-app/releases/download/v8.3.0/yolo26n.mlpackage.zip \
            -o /tmp/yolo26n.mlpackage.zip
          unzip -q /tmp/yolo26n.mlpackage.zip -d Models

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned app
        run: |
          xcodebuild \
            -project PersonBox.xcodeproj \
            -scheme PersonBox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/PersonBox.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/PersonBox.xcarchive/Products/Applications/PersonBox.app build/Payload/PersonBox.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/PersonBox-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonBox-unsigned-ipa
          path: build/PersonBox-unsigned.ipa

